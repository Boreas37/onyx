name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.buildCommit=${{ github.sha }} -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o onyx-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Package
        run: |
          # Archives always contain the binary under the canonical name
          # "onyx" — Homebrew and shell users expect it.
          cp onyx-${{ matrix.goos }}-${{ matrix.goarch }} onyx
          case "${{ matrix.goos }}" in
            windows)
              zip onyx-${{ matrix.goos }}-${{ matrix.goarch }}.zip onyx
              ;;
            *)
              tar -czf onyx-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz onyx
              ;;
          esac

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: onyx-${{ matrix.goos }}-${{ matrix.goarch }}
          path: onyx-${{ matrix.goos }}-${{ matrix.goarch }}.*

  release:
    name: publish release assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Checksums
        run: |
          cd dist
          find . -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec sha256sum {} + | sort -k2 > checksums.txt
          cat checksums.txt

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.tar.gz
            dist/**/*.zip
            dist/checksums.txt