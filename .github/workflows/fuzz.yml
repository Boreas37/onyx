name: fuzz

# Nightly fuzzing of the report-safety invariants: version extractors,
# REST/JSON parsers, the feed loader, the sanitizer, the report writers and
# the version range matcher. Each target gets a short budget; any crash or
# invariant violation fails the run and uploads the failing corpus entry as
# an artifact.
#
# Note: `go test -fuzz` accepts exactly one fuzz target per invocation, so
# the targets are enumerated explicitly.

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ./internal/scanner
            target: FuzzParseDetectedList
          - package: ./internal/scanner
            target: FuzzUsersFromJSON
          - package: ./internal/scanner
            target: FuzzExtractVersionFromReadme
          - package: ./internal/scanner
            target: FuzzExtractVersionFromStyleCSS
          - package: ./internal/scanner
            target: FuzzExtractWordPressVersion
          - package: ./internal/scanner
            target: FuzzAuthorSlugFromBody
          - package: ./internal/db
            target: FuzzLoad
          - package: ./internal/sanitize
            target: FuzzText
          - package: ./internal/version
            target: FuzzParse
          - package: ./internal/version
            target: FuzzInAffected
          # FuzzWriteReportSafety lives in internal/report (owned by another
          # agent). It may not exist on the very first CI run, so the guard
          # step below skips it gracefully instead of hard-failing.
          - package: ./internal/report
            target: FuzzWriteReportSafety
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: "Guard: fuzz target exists"
        id: guard
        run: |
          if grep -Rqs "func ${{ matrix.target }}" "${{ matrix.package }}"; then
            echo "exists=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::fuzz target Fuzz${{ matrix.target }} not found in ${{ matrix.package }} — skipping (may not have landed yet)"
            echo "exists=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Fuzz ${{ matrix.target }} (${{ matrix.package }})
        id: fuzz
        if: steps.guard.outputs.exists == '1'
        continue-on-error: true
        run: go test -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 120s ${{ matrix.package }}
      - name: Upload crash artifacts
        if: steps.fuzz.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: |
            ${{ matrix.package }}/testdata/fuzz/
      - name: Fail on crash
        if: steps.fuzz.outcome == 'failure'
        run: |
          echo "::error::fuzz target ${{ matrix.target }} found a failure — see artifact"
          exit 1
